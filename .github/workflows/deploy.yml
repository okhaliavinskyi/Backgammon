name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set — skipping deploy. See docs/DEPLOY.md"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ok == 'true'
        run: npm test
      - if: steps.secrets.outputs.ok == 'true'
        run: npm run build
      - name: wrangler deploy + smoke test
        if: steps.secrets.outputs.ok == 'true'
        working-directory: worker
        shell: bash
        run: |
          npx wrangler deploy | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -n "$URL" ]; then
            echo "### Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
            for i in 1 2 3 4 5; do curl -sf "$URL/api/health" && exit 0; sleep 5; done
            echo "Health check failed"; exit 1
          fi
      - name: Build mounted backgammon client
        if: steps.secrets.outputs.ok == 'true'
        run: npm run build:portal
      - name: Publish mounted client and verify API
        if: steps.secrets.outputs.ok == 'true'
        run: |
          npx wrangler deploy --config apps/portal/wrangler.jsonc
          curl --fail --retry 5 --retry-delay 5 https://onlineboard.fun/backgammon/api/health
