name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Engine unit tests (rules, AI self-play)
        run: npm test
      - name: Build web app
        run: npm run build
      - name: Validate worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry
        working-directory: worker
      - name: Install browser for guest progression tests
        run: npx playwright install --with-deps chromium
      - name: Integration tests against local worker
        working-directory: worker
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 --var EMAIL_FROM:login@local.test --var AUTH_ORIGIN:http://127.0.0.1:8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf 127.0.0.1:8787/api/health && break; sleep 1; done
          NARDY_URL=http://127.0.0.1:8787 NARDY_MAIL_LOG="$PWD/wrangler.log" npm run test:integration
      - name: Worker log on failure
        if: failure()
        run: cat worker/wrangler.log || true
