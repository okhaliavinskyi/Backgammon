name = "nardy"
main = "src/index.ts"
compatibility_date = "2025-10-01"
workers_dev = true

[assets]
directory = "../apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO", "LobbyDO"]

[observability]
enabled = true

[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "736401"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "CONNECT_LIMITER"
namespace_id = "736402"
simple = { limit = 120, period = 60 }

[[durable_objects.bindings]]
name = "PROFILE"
class_name = "ProfileDO"

[[migrations]]
tag = "v2-profiles"
new_sqlite_classes = ["ProfileDO"]

[[durable_objects.bindings]]
name = "MATCHMAKING"
class_name = "MatchmakingDO"

[[migrations]]
tag = "v3-ranked"
new_sqlite_classes = ["MatchmakingDO"]
